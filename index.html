<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>اختبار</title>
</head>
<body>
<h1>اختبار تسجيل الدخول</h1>
<input type="email" id="email" placeholder="البريد" style="padding:10px;width:300px"><br><br>
<input type="password" id="password" placeholder="كلمة المرور" style="padding:10px;width:300px"><br><br>
<button onclick="test()" style="padding:10px 30px">تسجيل الدخول</button>
<div id="result" style="margin-top:20px;padding:15px;border:2px solid #ccc"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
alert('الخطوة 1: الصفحة تحمّلت ✓');

const SUPABASE_URL = 'https://znkexrtkqzmsqnmzvxoq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpua2V4cnRrcXptc3FubXp2eG9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MTc3NDYsImV4cCI6MjEwMDk5Mzc0Nn0.QyPjqtKy0dS-uoXiefiPfXURnBqR_FBJcZMpGWj_1Rs';

alert('الخطوة 2: المفاتيح موجودة ✓');

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

alert('الخطوة 3: Supabase client تم إنشاؤه ✓');

async function test() {
  alert('الخطوة 4: تم الضغط على الزر ✓');
  
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  alert('الخطوة 5: الإيميل = ' + email);
  
  const resultDiv = document.getElementById('result');
  resultDiv.innerHTML = 'جاري...';
  
  try {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    
    if (error) {
      resultDiv.innerHTML = '❌ فشل: ' + error.message;
      resultDiv.style.borderColor = 'red';
    } else {
      resultDiv.innerHTML = '✅ نجح! الإيميل: ' + data.user.email;
      resultDiv.style.borderColor = 'green';
    }
  } catch (e) {
    resultDiv.innerHTML = '❌ استثناء: ' + e.message;
  }
}
</script>
</body>
</html>
