<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>اختبار نهائي</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background: #f0f2f5; font-family: Arial;">

<script>
// اختبار فوري
alert("✅ Script Started - الملف اتحمل بنجاح!");
document.body.style.background = "yellow";
console.log("🚀 Script Running");
</script>

<div id="loginScreen" style="max-width:400px;margin:100px auto;background:white;padding:40px;border-radius:12px;">
    <h1 style="text-align:center">نظام إدارة التمويل</h1>
    <input type="email" id="email" placeholder="البريد" style="width:100%;padding:10px;margin:10px 0;border:2px solid #ddd;border-radius:8px;">
    <input type="password" id="password" placeholder="كلمة المرور" style="width:100%;padding:10px;margin:10px 0;border:2px solid #ddd;border-radius:8px;">
    <button onclick="testLogin()" style="width:100%;padding:12px;background:#667eea;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer;">تسجيل الدخول</button>
    <div id="errorMsg" style="margin-top:15px;color:red;display:none;"></div>
</div>

<div id="dashboard" style="display:none;max-width:800px;margin:50px auto;background:#e8f5e9;padding:40px;border-radius:12px;border:3px solid #28a745;">
    <h1 style="color:#28a745;text-align:center">✅ تم تسجيل الدخول!</h1>
    <p id="userInfo" style="text-align:center;font-size:18px;"></p>
    <button onclick="doLogout()" style="padding:10px 30px;background:#dc3545;color:white;border:none;border-radius:8px;cursor:pointer;display:block;margin:20px auto;">خروج</button>
</div>

<div id="logBox" style="max-width:800px;margin:20px auto;background:#000;color:#0f0;padding:15px;border-radius:8px;font-family:monospace;max-height:300px;overflow-y:auto;"></div>

<script>
const SUPABASE_URL = 'https://znkexrtkqzmsqnmzvxoq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpua2V4cnRrcXptc3FubXp2eG9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MTc3NDYsImV4cCI6MjEwMDk5Mzc0Nn0.QyPjqtKy0dS-uoXiefiPfXURnBqR_FBJcZMpGWj_1Rs';

let supabase;
let currentUser = null; // مهم جداً!

function log(msg) {
    const div = document.getElementById('logBox');
    const line = document.createElement('div');
    line.textContent = '[' + new Date().toLocaleTimeString('ar-EG') + '] ' + msg;
    div.appendChild(line);
    console.log(msg);
}

log('✅ Script Started');

try {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    log('✅ Supabase Client Created');
} catch(err) {
    log('❌ Supabase Error: ' + err.message);
    alert('خطأ في Supabase: ' + err.message);
}

async function testLogin() {
    log('🔘 Button Clicked');
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    if (!email || !password) {
        alert('أدخل الإيميل والباسورد');
        return;
    }
    
    log('📧 Email: ' + email);
    
    try {
        const { data, error } = await supabase.auth.signInWithPassword({ 
            email: email, 
            password: password 
        });
        
        if (error) {
            log('❌ Login Failed: ' + error.message);
            alert('فشل: ' + error.message);
            return;
        }
        
        log('✅ Login Success: ' + data.user.email);
        
        // التصحيح المهم جداً:
        currentUser = data.user; // ده كنت ناسيه!
        
        log('📋 currentUser set to: ' + currentUser.id);
        
        // قراءة profile
        log('📖 Reading user_profiles...');
        try {
            const { data: profile, error: profError } = await supabase
                .from('user_profiles')
                .select('role')
                .eq('id', currentUser.id)
                .maybeSingle();
            
            if (profError) {
                log('⚠️ Profile Error: ' + profError.message);
            } else {
                log('✅ Profile OK - Role: ' + (profile?.role || 'admin'));
            }
        } catch(e) {
            log('❌ Profile Exception: ' + e.message);
        }
        
        // عرض Dashboard
        log('🎨 Showing Dashboard...');
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('userInfo').textContent = 'المستخدم: ' + currentUser.email;
        log('✅ Dashboard Shown!');
        
    } catch(err) {
        log('❌ Exception: ' + err.message);
        alert('خطأ: ' + err.message);
    }
}

async function doLogout() {
    await supabase.auth.signOut();
    location.reload();
}

log('✅ System Ready');
</script>
</body>
</html>
