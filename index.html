<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة التمويل</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Login Screen -->
  <div id="loginScreen">
    <h1>نظام إدارة التمويل</h1>
    <input type="email" id="loginEmail" placeholder="البريد الإلكتروني">
    <input type="password" id="loginPassword" placeholder="كلمة المرور">
    <button data-action="handleLoginClick">تسجيل الدخول</button>
  </div>

  <!-- App Container -->
  <div id="appContainer" style="display:none;">
    <nav>
      <button data-action="showScreen" data-screen="dashboard" class="nav-btn active">الرئيسية</button>
      <button data-action="showScreen" data-screen="clients" class="nav-btn">العملاء</button>
      <button data-action="showScreen" data-screen="investors" class="nav-btn">الممولين</button>
      <button data-action="showScreen" data-screen="operations" class="nav-btn">العمليات</button>
      <button data-action="showScreen" data-screen="transfers" class="nav-btn">التحويلات</button>
      <button data-action="showScreen" data-screen="activityLog" class="nav-btn admin-only">سجل النشاط</button>
      <button data-action="showScreen" data-screen="users" class="nav-btn admin-only">المستخدمين</button>
    </nav>

    <!-- Dashboard -->
    <div id="dashboard" class="screen active">
      <div id="dashboardAlerts"></div>
      <div class="stats-grid" id="dashboardStats"></div>
    </div>

    <!-- Clients -->
    <div id="clients" class="screen">
      <h2>العملاء</h2>
      <div class="table-actions">
        <input type="text" id="clientsSearch" placeholder="بحث...">
        <select id="clientsFilter">
          <option value="">الكل</option>
          <option value="active">نشط</option>
          <option value="archived">مؤرشف</option>
        </select>
        <button data-action="openClientModal" class="admin-only">+ إضافة عميل</button>
      </div>
      <div id="clientsTable"></div>
    </div>

    <!-- Investors -->
    <div id="investors" class="screen">
      <h2>الممولين</h2>
      <div class="table-actions">
        <input type="text" id="investorsSearch" placeholder="بحث...">
        <select id="investorsFilter">
          <option value="">الكل</option>
          <option value="active">نشط</option>
          <option value="archived">مؤرشف</option>
        </select>
        <button data-action="openInvestorModal" class="admin-only">+ إضافة ممول</button>
      </div>
      <div id="investorsTable"></div>
    </div>

    <!-- Operations -->
    <div id="operations" class="screen">
      <h2>العمليات</h2>
      <div class="table-actions">
        <input type="text" id="operationsSearch" placeholder="بحث...">
        <select id="operationsFilter">
          <option value="">الكل</option>
          <option value="draft">مسودة</option>
          <option value="active">نشطة</option>
          <option value="completed">منتهية</option>
          <option value="cancelled">ملغاة</option>
        </select>
        <button data-action="openOperationModal" class="admin-only">+ إضافة عملية</button>
      </div>
      <div id="operationsTable"></div>
    </div>

    <!-- Transfers -->
    <div id="transfers" class="screen">
      <h2>التحويلات المالية</h2>
      <div class="table-actions">
        <input type="text" id="transfersSearch" placeholder="بحث...">
        <select id="transfersFilter">
          <option value="">الكل</option>
          <option value="client">عميل</option>
          <option value="investor">ممول</option>
          <option value="company">شركة</option>
        </select>
        <button data-action="openTransferModal" class="admin-only">+ إضافة تحويل</button>
      </div>
      <div id="transfersTable"></div>
    </div>

    <!-- Activity Log -->
    <div id="activityLog" class="screen">
      <h2>سجل النشاط</h2>
      <div class="table-actions">
        <select id="activityFilterEntityType"></select>
        <select id="activityFilterActionType"></select>
        <select id="activityFilterUser"></select>
        <input type="date" id="activityFilterDateFrom">
        <input type="date" id="activityFilterDateTo">
        <input type="text" id="activityFilterSearch" placeholder="بحث...">
        <button data-action="resetActivityFilters">إعادة تعيين</button>
      </div>
      <div id="activityLogTable"></div>
    </div>

    <!-- Users -->
    <div id="users" class="screen">
      <h2>إدارة المستخدمين</h2>
      <div id="usersTable"></div>
    </div>
  </div>

  <!-- Client Modal -->
  <div id="clientModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="clientModalTitle">إضافة عميل</h2>
        <button class="close-btn" data-action="closeModal" data-modal="clientModal">&times;</button>
      </div>
      <form id="clientForm" data-submit="saveClient">
        <input type="hidden" id="clientId">
        <div class="form-group">
          <label for="clientName">الاسم *</label>
          <input type="text" id="clientName" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="clientPhone">الهاتف</label>
            <input type="tel" id="clientPhone">
          </div>
          <div class="form-group">
            <label for="clientEmail">البريد الإلكتروني</label>
            <input type="email" id="clientEmail">
          </div>
        </div>
        <div class="form-group">
          <label for="clientAddress">العنوان</label>
          <input type="text" id="clientAddress">
        </div>
        <div class="form-group">
          <label for="clientNotes">ملاحظات</label>
          <textarea id="clientNotes" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">حفظ</button>
      </form>
    </div>
  </div>

  <!-- Investor Modal -->
  <div id="investorModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="investorModalTitle">إضافة ممول</h2>
        <button class="close-btn" data-action="closeModal" data-modal="investorModal">&times;</button>
      </div>
      <form id="investorForm" data-submit="saveInvestor">
        <input type="hidden" id="investorId">
        <div class="form-group">
          <label for="investorName">الاسم *</label>
          <input type="text" id="investorName" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="investorPhone">الهاتف</label>
            <input type="tel" id="investorPhone">
          </div>
          <div class="form-group">
            <label for="investorEmail">البريد الإلكتروني</label>
            <input type="email" id="investorEmail">
          </div>
        </div>
        <div class="form-group">
          <label for="investorAddress">العنوان</label>
          <input type="text" id="investorAddress">
        </div>
        <div class="form-group">
          <label for="investorNotes">ملاحظات</label>
          <textarea id="investorNotes" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">حفظ</button>
      </form>
    </div>
  </div>

  <!-- Operation Modal -->
  <div id="operationModal" class="modal">
    <div class="modal-content large">
      <div class="modal-header">
        <h2 id="operationModalTitle">إضافة عملية</h2>
        <button class="close-btn" data-action="closeModal" data-modal="operationModal">&times;</button>
      </div>
      <form id="operationForm" data-submit="saveOperation">
        <input type="hidden" id="operationId">
        <div class="form-row">
          <div class="form-group">
            <label for="opName">اسم العملية *</label>
            <input type="text" id="opName" required>
          </div>
          <div class="form-group">
            <label for="opType">نوع العملية *</label>
            <select id="opType" required>
              <option value="financing">تمويل</option>
              <option value="supply">توريد</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="opClient">العميل *</label>
            <select id="opClient" required></select>
          </div>
          <div class="form-group">
            <label for="opAmount">قيمة التمويل *</label>
            <input type="number" id="opAmount" step="0.01" min="0.01" required>
          </div>
        </div>
        <div class="form-group">
          <label for="opInvestorDisplayAmount">المبلغ الظاهر للممول</label>
          <input type="number" id="opInvestorDisplayAmount" step="0.01" min="0">
        </div>
        <div class="form-row profit-field">
          <div class="form-group">
            <label for="opExpectedProfit">الربح المتوقع</label>
            <input type="number" id="opExpectedProfit" step="0.01" min="0">
          </div>
          <div class="form-group">
            <label for="opFinalProfit">الربح النهائي</label>
            <input type="number" id="opFinalProfit" step="0.01" min="0">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="opStartDate">تاريخ البداية *</label>
            <input type="date" id="opStartDate" required>
          </div>
          <div class="form-group">
            <label for="opDurationDays">عدد الأيام</label>
            <input type="number" id="opDurationDays" min="1">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="opEndDate">تاريخ النهاية</label>
            <input type="date" id="opEndDate">
          </div>
          <div class="form-group">
            <label for="opStatus">الحالة</label>
            <select id="opStatus">
              <option value="draft">تحت الإنشاء</option>
              <option value="active">نشطة</option>
              <option value="completed">انتهت</option>
              <option value="cancelled">ألغيت</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="opNotes">ملاحظات</label>
          <textarea id="opNotes" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">حفظ</button>
      </form>
    </div>
  </div>

  <!-- Operation Details Modal -->
  <div id="operationDetailsModal" class="modal">
    <div class="modal-content large">
      <div class="modal-header">
        <h2 id="opDetailsTitle">تفاصيل العملية</h2>
        <button class="close-btn" data-action="closeModal" data-modal="operationDetailsModal">&times;</button>
      </div>
      <div id="opSummaryGrid"></div>
      <div class="workflow-actions admin-only" id="workflowActions">
        <button data-action="activateOperation">🚀 تفعيل</button>
        <button data-action="clientRepayment">💰 سداد</button>
        <button data-action="profitDistribution">📊 أرباح</button>
        <button data-action="capitalReturn">🔄 إرجاع</button>
        <button data-action="completeOperation">✅ إنهاء</button>
        <button data-action="unlockOperation" id="unlockBtn" style="display:none;">🔓 فتح</button>
      </div>
      <div class="tabs">
        <button class="tab active" data-action="switchTab" data-tab="investors">الممولين</button>
        <button class="tab" data-action="switchTab" data-tab="transfers">التحويلات</button>
        <button class="tab" data-action="switchTab" data-tab="timeline">السجل</button>
      </div>
      <div id="opTabInvestors" class="tab-content active">
        <div id="opInvestorsList"></div>
        <button data-action="addInvestorToOp" class="admin-only">+ إضافة ممول</button>
      </div>
      <div id="opTabTransfers" class="tab-content">
        <div id="opTransfersList"></div>
        <button data-action="addTransferToOp" class="admin-only">+ إضافة تحويل</button>
      </div>
      <div id="opTabTimeline" class="tab-content">
        <div id="opTimelineList"></div>
      </div>
    </div>
  </div>

  <!-- Add Investor to Operation Modal -->
  <div id="addInvestorToOpModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>إضافة ممول للعملية</h2>
        <button class="close-btn" data-action="closeModal" data-modal="addInvestorToOpModal">&times;</button>
      </div>
      <form id="addInvestorToOpForm" data-submit="saveOpInvestor">
        <div class="form-group">
          <label for="newOpInvestorId">الممول *</label>
          <select id="newOpInvestorId" required></select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="newOpInvestorContribution">المساهمة *</label>
            <input type="number" id="newOpInvestorContribution" step="0.01" min="0.01" required>
          </div>
          <div class="form-group profit-field">
            <label for="newOpInvestorProfit">الربح</label>
            <input type="number" id="newOpInvestorProfit" step="0.01" min="0">
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">إضافة</button>
      </form>
    </div>
  </div>

  <!-- Transfer Modal (محدث) -->
  <div id="transferModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="transferModalTitle">إضافة تحويل</h2>
        <button class="close-btn" data-action="closeModal" data-modal="transferModal">&times;</button>
      </div>
      <div id="transferValidationWarning"></div>
      <form id="transferForm" data-submit="saveTransfer">
        <input type="hidden" id="transferId">
        <input type="hidden" id="transferFromParty">
        <input type="hidden" id="transferToParty">
        <input type="hidden" id="transferTransactionCategory">
        
        <div class="form-group">
          <label for="transferFromType">من (مصدر الأموال) *</label>
          <select id="transferFromType" required>
            <option value="">-- اختر المصدر --</option>
            <option value="company">الشركة</option>
            <option value="client">عميل</option>
            <option value="investor">ممول</option>
          </select>
        </div>

        <div class="form-group" id="transferFromEntityRow" style="display:none;background:#eef0ff;padding:12px;border-radius:10px;border:2px solid #667eea;margin:12px 0;">
          <label id="transferFromEntityLabel" style="display:block;font-weight:bold;color:#4c5fd5;margin-bottom:8px;">اختر الطرف *</label>
          <select id="transferFromEntity" style="width:100%;padding:12px;font-size:16px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;"></select>
        </div>

        <div class="form-group">
          <label for="transferToType">إلى (الجهة المستلمة) *</label>
          <select id="transferToType" required>
            <option value="">-- اختر المستلم --</option>
            <option value="company">الشركة</option>
            <option value="client">عميل</option>
            <option value="investor">ممول</option>
          </select>
        </div>

        <div class="form-group" id="transferToEntityRow" style="display:none;background:#eef0ff;padding:12px;border-radius:10px;border:2px solid #667eea;margin:12px 0;">
          <label id="transferToEntityLabel" style="display:block;font-weight:bold;color:#4c5fd5;margin-bottom:8px;">اختر الطرف *</label>
          <select id="transferToEntity" style="width:100%;padding:12px;font-size:16px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;"></select>
        </div>

        <div class="transfer-summary" id="transferSummary" style="display:none;">
          <div class="summary-arrow">
            <span id="summaryFrom">-</span>
            <span class="arrow-icon">←</span>
            <span id="summaryTo">-</span>
          </div>
          <div class="summary-category" id="summaryCategory"></div>
        </div>

        <!-- ✅ حقل الغرض المفقود -->
        <div class="form-group" id="transferPurposeRow" style="display:none;">
          <label for="transferPurpose">الغرض *</label>
          <select id="transferPurpose" style="width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:8px;"></select>
        </div>

        <div class="form-group">
          <label for="transferAmount">المبلغ *</label>
          <input type="number" id="transferAmount" step="0.01" min="0.01" required>
        </div>

        <div class="form-group">
          <label for="transferOperation">العملية (اختياري)</label>
          <select id="transferOperation">
            <option value="">-- بدون عملية --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="transferDate">التاريخ *</label>
          <input type="date" id="transferDate" required>
        </div>

        <div class="form-group">
          <label for="transferNotes">ملاحظات</label>
          <textarea id="transferNotes" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-block">حفظ</button>
      </form>
    </div>
  </div>

  <!-- Debug Panel Button -->
  <button id="debugToggle" onclick="toggleDebug()" style="position:fixed;bottom:20px;right:20px;z-index:9999;">🐞</button>

  <!-- Scripts -->
  <script src="js/core.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/clients.js"></script>
  <script src="js/investors.js"></script>
  <script src="js/operations.js"></script>
  <script src="js/transfers.js"></script>
  <script src="js/activity.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
