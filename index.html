<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار الانتقال</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { font-family: Arial; padding: 20px; }
#loginScreen, #dashboard { padding: 20px; border: 2px solid #ccc; border-radius: 10px; margin: 10px 0; }
#dashboard { display: none; background: #e8f5e9; }
input { padding: 10px; margin: 5px; width: 300px; display: block; }
button { padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 10px 0; }
.log { background: white; padding: 10px; margin: 5px 0; border-radius: 5px; }
.error { background: #ffebee; color: red; }
.success { background: #e8f5e9; color: green; }
</style>
</head>
<body>

<h1>🧪 اختبار الانتقال بعد تسجيل الدخول</h1>

<div id="loginScreen">
    <h2>تسجيل الدخول</h2>
    <input type="email" id="email" placeholder="البريد الإلكتروني">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button onclick="testLogin()">تسجيل الدخول</button>
</div>

<div id="dashboard">
    <h2>✅ Dashboard - تم الدخول بنجاح!</h2>
    <p>إذا كنت ترى هذه الصفحة، فالانتقال يعمل!</p>
    <button onclick="logout()">خروج</button>
</div>

<div id="logs"></div>

<script>
const logsDiv = document.getElementById('logs');

function addLog(msg, type='info') {
    const div = document.createElement('div');
    div.className = 'log ' + type;
    div.innerHTML = msg;
    logsDiv.appendChild(div);
    console.log(msg);
}

const SUPABASE_URL = 'https://znkexrtkqzmsqnmzvxoq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpua2V4cnRrcXptc3FubXp2eG9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MTc3NDYsImV4cCI6MjEwMDk5Mzc0Nn0.QyPjqtKy0dS-uoXiefiPfXURnBqR_FBJcZMpGWj_1Rs';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
addLog('✅ Supabase Client تم إنشاؤه', 'success');

async function testLogin() {
    addLog('🔄 بدء تسجيل الدخول...', 'info');
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        
        if (error) {
            addLog('❌ فشل تسجيل الدخول: ' + error.message, 'error');
            return;
        }
        
        addLog('✅ تم تسجيل الدخول بنجاح!', 'success');
        addLog('User ID: ' + data.user.id, 'success');
        
        // محاولة قراءة profile
        addLog(' جاري قراءة user_profiles...', 'info');
        
        try {
            const { data: profile, error: profileError } = await supabase
                .from('user_profiles')
                .select('*')
                .eq('id', data.user.id)
                .single();
            
            if (profileError) {
                addLog('⚠️ تحذير: ' + profileError.message, 'error');
                addLog('سأعتبرك admin رغم الخطأ', 'success');
            } else {
                addLog('✅ Role: ' + profile.role, 'success');
            }
        } catch (e) {
            addLog('⚠️ استثناء في profile: ' + e.message, 'error');
        }
        
        // الانتقال إلى Dashboard
        addLog('🔄 جاري الانتقال إلى Dashboard...', 'info');
        
        try {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            addLog('✅ تم الانتقال إلى Dashboard!', 'success');
        } catch (e) {
            addLog('❌ خطأ في الانتقال: ' + e.message, 'error');
        }
        
    } catch (e) {
        addLog('❌ استثناء: ' + e.message, 'error');
    }
}

async function logout() {
    await supabase.auth.signOut();
    location.reload();
}
</script>
</body>
</html>
