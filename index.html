<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>اختبار</title>
</head>
<body>
<h1>اختبار الزر</h1>
<button onclick="alert('الزر شغال!')">زر 1: Alert مباشر</button>
<br><br>
<button onclick="testFunc()">زر 2: يستدعي دالة</button>
<br><br>
<input type="text" id="testInput" placeholder="اكتب هنا">
<br><br>
<button onclick="testInput2()">زر 3: يقرأ Input</button>

<script>
alert('1. الصفحة اتحملت');

function testFunc() {
    alert('2. الدالة اشتغلت!');
}

function testInput2() {
    const val = document.getElementById('testInput').value;
    alert('3. قيمة الـ Input: ' + val);
}

alert('4. typeof testFunc = ' + typeof testFunc);
alert('5. النظام جاهز - جرب الأزرار التلاتة');
</script>
</body>
</html>
