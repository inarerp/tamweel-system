<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>اختبار</title>

</head>
<body style="font-family: Arial; padding: 20px;">
  <h1>اختبار Supabase</h1>
  <div id="result" style="padding: 20px; border: 2px solid #ccc; margin: 20px;">جاري الاختبار...</div>
  
  <script>
    const SUPABASE_URL = 'https://znkexrtkqzmsqnmzvxoq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpua2V4cnRrcXptc3FubXp2eG9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MTc3NDYsImV4cCI6MjEwMDk5Mzc0Nn0.QyPjqtKy0dS-uoXiefiPfXURnBqR_FBJcZMpGWj_1Rs';
    
    try {
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      
      supabase.from('clients').select('count', { count: 'exact', head: true }).then(({ data, error }) => {
        const resultDiv = document.getElementById('result');
        if (error) {
          resultDiv.innerHTML = '❌ خطأ: ' + error.message;
          resultDiv.style.borderColor = 'red';
          resultDiv.style.background = '#ffebee';
        } else {
          resultDiv.innerHTML = '✅ نجح الاتصال بـ Supabase!';
          resultDiv.style.borderColor = 'green';
          resultDiv.style.background = '#e8f5e9';
        }
      });
    } catch (e) {
      document.getElementById('result').innerHTML = '❌ استثناء: ' + e.message;
    }
  </script>
</body>
</html>
