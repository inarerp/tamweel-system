<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>AI Code Manager</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body { background: #1e1e1e; color: #eee; padding: 15px; }
  h2 { margin-bottom: 10px; color: #4ec9b0; font-size: 18px; }
  .container { max-width: 1100px; margin: auto; }
  textarea {
    width: 100%; height: 400px; background: #252526; color: #d4d4d4;
    border: 1px solid #3c3c3c; padding: 10px; font-family: Consolas, monospace;
    font-size: 14px; resize: vertical; border-radius: 4px;
  }
  .row { display: flex; gap: 10px; margin: 10px 0; align-items: center; flex-wrap: wrap; }
  input, select {
    background: #252526; color: #eee; border: 1px solid #3c3c3c;
    padding: 8px 12px; border-radius: 4px; font-size: 14px;
  }
  input:focus, textarea:focus { outline: none; border-color: #4ec9b0; }
  button {
    background: #0e639c; color: white; border: none; padding: 8px 16px;
    border-radius: 4px; cursor: pointer; font-size: 14px;
  }
  button:hover { background: #1177bb; }
  .btn-green { background: #16825d; }
  .btn-green:hover { background: #1a9d6f; }
  .btn-orange { background: #c2702c; }
  .btn-orange:hover { background: #d9823a; }
  .section {
    background: #252526; padding: 12px; border-radius: 6px;
    margin-bottom: 12px; border: 1px solid #3c3c3c;
  }
  .stats { color: #888; font-size: 13px; margin-top: 5px; }
  label { font-size: 13px; color: #aaa; }
</style>
</head>
<body>
<div class="container">

  <h2>📝 AI Code Manager</h2>

  <!-- منطقة الكود -->
  <div class="section">
    <label>الكود:</label>
    <textarea id="codeArea" placeholder="الصق الكود هنا من Qwen..."></textarea>
    <div class="stats" id="stats">الأسطر: 0 | الأحرف: 0</div>
  </div>

  <!-- حفظ وتحميل -->
  <div class="section">
    <h2>💾 حفظ / تحميل</h2>
    <div class="row">
      <input type="text" id="fileName" placeholder="اسم الملف" value="index">
      <select id="ext">
        <option value=".html">.html</option>
        <option value=".js">.js</option>
        <option value=".css">.css</option>
        <option value=".py">.py</option>
        <option value=".json">.json</option>
        <option value=".txt">.txt</option>
        <option value=".xml">.xml</option>
        <option value="">بدون امتداد</option>
      </select>
      <button class="btn-green" onclick="saveFile()">حفظ الملف</button>
      <button class="btn-orange" onclick="document.getElementById('loadFile').click()">تحميل ملف</button>
      <input type="file" id="loadFile" style="display:none" accept=".html,.js,.css,.py,.json,.txt,.xml" onchange="loadFile(event)">
    </div>
  </div>

  <!-- استبدال -->
  <div class="section">
    <h2>🔄 استبدال نص</h2>
    <div class="row">
      <input type="text" id="findText" placeholder="ابحث عن..." style="flex:1">
      <input type="text" id="replaceText" placeholder="استبدل بـ..." style="flex:1">
      <button onclick="doReplace()">استبدال</button>
      <button onclick="doReplaceAll()">استبدال الكل</button>
    </div>
  </div>

  <!-- إضافة بعد سطر -->
  <div class="section">
    <h2>➕ إضافة نص بعد سطر</h2>
    <div class="row">
      <label>رقم السطر:</label>
      <input type="number" id="lineNum" min="1" value="1" style="width:80px">
      <input type="text" id="insertText" placeholder="النص المراد إضافته" style="flex:1">
      <button onclick="insertAfterLine()">إضافة</button>
    </div>
  </div>

</div>

<script>
const codeArea = document.getElementById('codeArea');
const stats = document.getElementById('stats');

// تحديث الإحصائيات
function updateStats() {
  const text = codeArea.value;
  const lines = text ? text.split('\n').length : 0;
  stats.textContent = `الأسطر: ${lines} | الأحرف: ${text.length}`;
}
codeArea.addEventListener('input', updateStats);
updateStats();

// حفظ الملف
function saveFile() {
  const name = document.getElementById('fileName').value.trim();
  const ext = document.getElementById('ext').value;
  if (!name) { alert('اكتب اسم الملف'); return; }
  
  const blob = new Blob([codeArea.value], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name + ext;
  a.click();
  URL.revokeObjectURL(url);
}

// تحميل ملف
function loadFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    codeArea.value = e.target.result;
    // استخراج الاسم والامتداد
    const parts = file.name.split('.');
    if (parts.length > 1) {
      document.getElementById('fileName').value = parts.slice(0, -1).join('.');
      const loadedExt = '.' + parts[parts.length - 1];
      const extSelect = document.getElementById('ext');
      for (let opt of extSelect.options) {
        if (opt.value === loadedExt) { extSelect.value = loadedExt; break; }
      }
    } else {
      document.getElementById('fileName').value = file.name;
      document.getElementById('ext').value = '';
    }
    updateStats();
  };
  reader.readAsText(file);
  event.target.value = '';
}

// استبدال أول ظهور
function doReplace() {
  const find = document.getElementById('findText').value;
  const replace = document.getElementById('replaceText').value;
  if (!find) return;
  codeArea.value = codeArea.value.replace(find, replace);
  updateStats();
}

// استبدال الكل
function doReplaceAll() {
  const find = document.getElementById('findText').value;
  const replace = document.getElementById('replaceText').value;
  if (!find) return;
  const escaped = find.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  codeArea.value = codeArea.value.replace(new RegExp(escaped, 'g'), replace);
  updateStats();
}

// إضافة بعد سطر
function insertAfterLine() {
  const lineNum = parseInt(document.getElementById('lineNum').value);
  const text = document.getElementById('insertText').value;
  const lines = codeArea.value.split('\n');
  if (lineNum < 1 || lineNum > lines.length) {
    alert('رقم السطر غير صحيح'); return;
  }
  lines.splice(lineNum, 0, text);
  codeArea.value = lines.join('\n');
  updateStats();
}

// اختصارات لوحة المفاتيح
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 's') { e.preventDefault(); saveFile(); }
});
</script>
</body>
</html>
